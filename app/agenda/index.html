<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda tu producción · Música Tiempo de Dios</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Enlace de agenda de producción para artistas (/agenda/<código>). Mismo estilo que cancion/: banda Night con franja Flame. */
:root{
  --night:#1B1C1A; --flame:#FF3D1A; --baby:#98D5E0; --sea:#E8351A; --ok:#1DB954;
  --bg:#FFFFFF; --surface:#F4F7F7; --fg:#1B1C1A; --muted:#5E6766; --line:#DDE5E5;
  --sea-ink:#C2300F; --sea-soft:#FFE7E1; --band:#1B1C1A;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1B1C1A; --surface:#242623; --fg:#F5F7F6; --muted:#A3ADAC; --line:#353835;
  --sea-ink:#FF8A70; --sea-soft:#3A2019; --band:#121311; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--baby);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band);color:#fff;border-bottom:8px solid var(--sea)}
.band .wrap{padding-block:26px 30px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#C9D2D1}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
h1{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(32px,6.5vw,50px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--baby)}
.lead{margin:0;color:#D7DEDD;max-width:62ch}
.meta{display:flex;gap:10px 16px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:#A9B3B2}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sea);color:#fff;font-family:var(--display);font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;align-self:flex-start}
main .wrap{padding-block:28px 80px;display:flex;flex-direction:column;gap:22px}
.notice{border-radius:12px;padding:12px 16px;font-size:14.5px;background:var(--sea-soft);border:1.5px solid var(--flame)}
.mes{display:flex;flex-direction:column;gap:10px}
.mes h2{margin:0;font-family:var(--display);font-weight:900;font-size:22px;font-stretch:106%}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.op{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.op b{font-family:var(--display);font-size:18px;font-weight:900}
.op span{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.op:hover{border-color:var(--ok)}
.op[aria-pressed="true"]{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.vacio{color:var(--muted);margin:0}
.sec{border:1.5px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font-family:var(--display);font-weight:900;font-size:22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f.full{grid-column:1/-1}
.f label{font-weight:700;font-size:14.5px}
.in{width:100%;min-width:0;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;background:var(--bg)}
textarea.in{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
@media (max-width:600px){.fields{grid-template-columns:1fr}.sec{padding:18px 16px}}
.btn{height:52px;border:0;border-radius:12px;padding:0 26px;font-family:var(--display);font-weight:900;font-size:17px;background:var(--flame);color:#fff;align-self:flex-start}
.btn:disabled{opacity:.55;cursor:default}
.done{border:1.5px solid var(--line);border-radius:18px;padding:34px 26px;display:flex;flex-direction:column;gap:12px;border-top:8px solid var(--ok)}
.done h2{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:1.05}
.done p{margin:0;color:var(--muted);max-width:56ch}
.reglas{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brandrow"><span class="dots"><i style="background:#FF3D1A"></i><i style="background:#98D5E0"></i><i style="background:#457A7F"></i></span>Tiempo de Dios · Música</div>
    <h1>Agenda tu <em>producción</em></h1>
    <p class="lead" id="lead">Elige las fechas que te funcionen. Solo ves las semanas en las que tenemos lugar para tu tipo de producción.</p>
    <span class="pill" id="tipo" hidden></span>
    <div class="meta"><span>Horario de 9:00 a 17:00</span><span>Enlace personal: no lo compartas</span></div>
  </div>
</header>
<main><div class="wrap" id="app"><p class="vacio">Cargando fechas…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.publico.js"></script>
<script src="/agenda-reglas.js"></script>
<script>
const $=id=>document.getElementById(id),A=window.AGENDA,{key,fromKey,addDays}=A.util;
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],MESES_L=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const rango=(a,b)=>{const x=fromKey(a),y=fromKey(b);return `${DIAS[x.getDay()]} ${x.getDate()}${x.getMonth()!==y.getMonth()?" "+MESES[x.getMonth()]:""} – ${DIAS[y.getDay()]} ${y.getDate()} ${MESES[y.getMonth()]}`};
// Código del enlace: /agenda/<código> o agenda/?t=<código>
const token=(location.pathname.match(/\/agenda\/([a-z0-9-]+)\/?$/i)||[])[1]||new URLSearchParams(location.search).get("t")||"";
const cfg=window.BITACORA_CONFIG||{};let sb=null,datos=null,elegida=null;
if(window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});
const app=$("app");
function mensaje(t){app.innerHTML=`<div class="notice">${t}</div>`}
async function cargar(){
  if(!token){mensaje("Este enlace no está completo. Pide al equipo de Música que te lo vuelva a mandar.");return}
  if(!sb){mensaje("La agenda todavía no está configurada.");return}
  const {data,error}=await sb.rpc("agenda_ver",{t:token});
  if(error){mensaje("No pudimos leer la agenda. Intenta de nuevo en un momento.");return}
  if(!data){mensaje("Este enlace ya no está activo. Pide al equipo de Música uno nuevo.");return}
  datos=data;const T=A.TIPOS_PROD[data.tipo]||A.TIPOS_PROD.fullband;
  $("tipo").hidden=false;$("tipo").textContent=`${T.n} · ${T.dias} días hábiles`;
  if(data.nombre)$("lead").textContent=`Hola, ${data.nombre}. Elige las fechas que te funcionen: solo ves las semanas en las que tenemos lugar para tu tipo de producción.`;
  if(data.reservado){hecho(data.reservado.inicio,data.reservado.fin,true);return}
  pintar()}
function pintar(){const T=A.TIPOS_PROD[datos.tipo]||A.TIPOS_PROD.fullband,manana=key(addDays(new Date(),1));
  // Un año hacia adelante desde que se abre la liga; solo semanas de producción con lugar para este tipo
  const sem=A.disponibles(datos.eventos||[],manana,53,datos.tipo),porMes={},limite=key(addDays(new Date(),366));
  sem.forEach(s=>s.opciones.filter(o=>o.inicio>=manana&&o.inicio<=limite).forEach(o=>{const m=o.inicio.slice(0,7);(porMes[m]=porMes[m]||[]).push(o)}));
  const meses=Object.keys(porMes).sort();
  app.innerHTML=`<ul class="reglas"><li>${esc(T.desc)}</li><li>Producimos de 9:00 a 17:00 en las primeras tres semanas de cada mes: lunes, martes, jueves y viernes (el miércoles es para otras áreas; si ese viernes tenemos actividad, se produce de lunes a jueves).</li><li>Puedes ver y apartar fechas para los próximos 12 meses.</li></ul>
    ${meses.length?meses.map(m=>{const [y,mm]=m.split("-").map(Number);return `<section class="mes"><h2>${MESES_L[mm-1][0].toUpperCase()+MESES_L[mm-1].slice(1)} ${y}</h2><div class="ops">${porMes[m].map(o=>`<button type="button" class="op" data-op="${o.inicio}|${o.fin}" aria-pressed="${!!elegida&&elegida.inicio===o.inicio}"><b>${rango(o.inicio,o.fin)}</b><span>${o.bloque==="2S"?"2 semanas":o.bloque==="AB"?"Semana completa":"2 días"}${o.dias&&o.bloque==="AB"?" · "+o.dias.map(d=>DIAS[fromKey(d).getDay()]).join(", "):""}</span></button>`).join("")}</div></section>`}).join("")
      :`<div class="notice">Por ahora no hay fechas libres para este tipo de producción en los próximos 12 meses. Escríbele al equipo de Música para buscar una opción.</div>`}
    <form class="sec" id="form" ${elegida?"":"hidden"} autocomplete="on"><h2>Confirma tus datos</h2>
      <p style="margin:0">Fechas elegidas: <b id="elegida">${elegida?rango(elegida.inicio,elegida.fin):""}</b></p>
      <div class="fields"><div class="f"><label for="nom">Nombre</label><input class="in" id="nom" required maxlength="120" autocomplete="name"></div>
        <div class="f"><label for="cor">Correo</label><input class="in" id="cor" type="email" required maxlength="160" autocomplete="email"></div>
        <div class="f"><label for="tel">Teléfono o WhatsApp</label><input class="in" id="tel" maxlength="40" autocomplete="tel"></div>
        ${datos.reutilizable?`<div class="f full"><label for="can">¿Qué canción vas a producir? <small>(opcional)</small></label><input class="in" id="can" maxlength="120"></div>`:""}
        <div class="f full"><label for="not">¿Algo que debamos saber? <small>(opcional)</small></label><textarea class="in" id="not" maxlength="1000"></textarea></div></div>
      <button class="btn" type="submit" id="enviar">Apartar estas fechas</button></form>`}
function hecho(a,b,ya){$("tipo").hidden=false;app.innerHTML=`<div class="done"><h2>${ya?"Tus fechas ya están apartadas":"¡Listo! Tus fechas quedaron apartadas"}</h2><p><b>${rango(String(a).slice(0,10),String(b).slice(0,10))}</b>, de 9:00 a 17:00.</p><p>El equipo de Música te va a contactar para confirmar los detalles. Si necesitas cambiar la fecha, escríbeles directamente.</p>${datos&&datos.reutilizable?`<button type="button" class="btn" id="otra">Agendar otra canción</button>`:""}</div>`;
  const o=$("otra");if(o)o.onclick=()=>{elegida=null;cargar()}}
app.addEventListener("click",e=>{const b=e.target.closest("[data-op]");if(!b)return;const [i,f]=b.dataset.op.split("|");elegida={inicio:i,fin:f};
  const can=$("can")&&$("can").value,nom=$("nom")&&$("nom").value,cor=$("cor")&&$("cor").value,tel=$("tel")&&$("tel").value,not=$("not")&&$("not").value;pintar();
  if(nom)$("nom").value=nom;else contacto();if(can&&$("can"))$("can").value=can;if(cor)$("cor").value=cor;if(tel)$("tel").value=tel;if(not)$("not").value=not;$("form").scrollIntoView({behavior:"smooth",block:"start"})});
app.addEventListener("submit",async e=>{e.preventDefault();if(!elegida)return;const btn=$("enviar");btn.disabled=true;btn.textContent="Apartando…";
  const {error}=await sb.rpc("agenda_reservar",{t:token,inicio:elegida.inicio,fin:elegida.fin,nombre:$("nom").value.trim(),correo:$("cor").value.trim(),telefono:$("tel").value.trim(),notas:[$("can")&&$("can").value.trim()?"Canción: "+$("can").value.trim():"",$("not").value.trim()].filter(Boolean).join("\n")});
  if(error){btn.disabled=false;btn.textContent="Apartar estas fechas";alert(error.message||"No se pudo apartar. Intenta de nuevo.");if(/apartar esas fechas/.test(error.message||"")){elegida=null;cargar()}return}
  try{const c=JSON.parse(localStorage.getItem(CONTACTO)||"{}")||{};localStorage.setItem(CONTACTO,JSON.stringify({...c,nombre:$("nom").value.trim(),correo:$("cor").value.trim(),telefono:$("tel").value.trim()}))}catch(e){}
  hecho(elegida.inicio,elegida.fin,false)});
/* Datos de contacto que el artista ya dio en este dispositivo (registro de canción o agenda anterior) */
const CONTACTO="tdd-contacto-artista";
function contacto(){let c=null;try{c=JSON.parse(localStorage.getItem(CONTACTO)||"null")}catch(e){}if(!c)return;
  if($("nom")&&!$("nom").value&&c.nombre)$("nom").value=c.nombre;if($("cor")&&!$("cor").value&&c.correo)$("cor").value=c.correo;if($("tel")&&!$("tel").value&&c.telefono)$("tel").value=c.telefono}
cargar();
</script>
</body>
</html>
