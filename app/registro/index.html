<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regístrate · Tiempo de Dios</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Registro público a cenáculos y eventos (/registro, /registro/cenaculo, /registro/<id del evento>).
   También: liga personal de correos y WhatsApp (?t=<token>&e=&f=[&r=si|no]) y baja de correos (?baja=<token>).
   Mismo estilo que agenda/: banda Night, aquí con franja Sol (Operativo). */
:root{
  --night:#1B1C1A; --flame:#FF3D1A; --sol:#F2B33D; --baby:#98D5E0; --ok:#1DB954;
  --bg:#FFFFFF; --surface:#F4F7F7; --fg:#1B1C1A; --muted:#5E6766; --line:#DDE5E5; --soft:#FFF4DD; --band:#1B1C1A;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1B1C1A; --surface:#242623; --fg:#F5F7F6; --muted:#A3ADAC; --line:#353835; --soft:#3A2F17; --band:#121311; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--baby);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band);color:#fff;border-bottom:8px solid var(--sol)}
.band .wrap{padding-block:26px 30px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#C9D2D1}
.brandrow img{width:28px;height:28px;border-radius:8px}
h1{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(32px,7vw,50px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--sol)}
.lead{margin:0;color:#D7DEDD;max-width:60ch}
main .wrap{padding-block:26px 80px;display:flex;flex-direction:column;gap:20px}
.notice{border-radius:12px;padding:12px 16px;font-size:15px;background:var(--soft);border:1.5px solid var(--sol)}
.notice.err{border-color:var(--flame)}
h2{margin:0;font-family:var(--display);font-weight:900;font-size:22px;font-stretch:106%}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.op{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px}
.op b{font-family:var(--display);font-size:17px;font-weight:900;line-height:1.2}
.op span{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.op:hover{border-color:var(--sol)}
.op[aria-pressed="true"]{border-color:var(--sol);box-shadow:inset 0 0 0 2px var(--sol)}
.sec{border:1.5px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f.full{grid-column:1/-1}
.f label{font-weight:700;font-size:14.5px}
.f small{color:var(--muted);font-size:13px}
.in{width:100%;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;background:var(--bg)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--muted)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--sol);flex:none}
.trampa{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:600px){.fields{grid-template-columns:1fr}.sec{padding:18px 16px}}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:52px;border:0;border-radius:12px;padding:0 26px;font-family:var(--display);font-weight:900;font-size:17px;background:var(--flame);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px;align-self:flex-start}
.done{border:1.5px solid var(--line);border-radius:18px;padding:30px 24px;display:flex;flex-direction:column;gap:12px;border-top:8px solid var(--ok)}
.done.no{border-top-color:var(--muted)}
.done h2{font-size:28px;line-height:1.1}
.done p{margin:0;color:var(--muted);max-width:56ch}
.cuando{font-family:var(--mono);font-size:14px;color:var(--fg)}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brandrow"><img src="/icono-512.png" alt="">Tiempo de Dios</div>
    <h1 id="h1">Regístrate al <em>cenáculo</em></h1>
    <p class="lead" id="lead">Aparta tu lugar en un minuto. Te mandaremos un recordatorio unos días antes.</p>
  </div>
</header>
<main><div class="wrap" id="app"><p>Cargando…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.publico.js"></script>
<script src="/agenda-reglas.js"></script>
<script>
const $=id=>document.getElementById(id),A=window.AGENDA,{key,fromKey,addDays}=A.util;
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const larga=k=>{const d=fromKey(k);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const hora12=h=>{if(!h)return "";const [H,M]=h.split(":").map(Number);return `${(H+11)%12+1}:${String(M).padStart(2,"0")} ${H<12?"a. m.":"p. m."}`};
const Q=new URLSearchParams(location.search),UUID=/^[0-9a-f-]{36}$/i;
// /registro/cenaculo → el próximo cenáculo; /registro/<id> → ese evento; ?e=<id>&f=<fecha> → esa fecha
const RUTA=((location.pathname.match(/\/registro\/([a-z0-9-]+)\/?$/i)||[])[1]||"").toLowerCase();
const cfg=window.BITACORA_CONFIG||{};let sb=null;
if(window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});
const app=$("app");
const aviso=(t,err)=>{app.innerHTML=`<div class="notice${err?" err":""}">${t}</div>`};
const errTxt=e=>String((e&&e.message)||e||"").replace(/^.*?:\s*(?=[A-ZÁÉÍÓÚÑ¿])/,"")||"Algo falló. Intenta de nuevo.";
function titulo(h,l){$("h1").innerHTML=h;if(l!==undefined)$("lead").textContent=l}
function cuandoTxt(o){return `${larga(o.fecha)}${o.hora?` · ${hora12(o.hora)}`:""}${o.lugar?` · ${o.lugar}`:""}`}

/* ---------- Darse de baja ---------- */
async function baja(t){titulo("Correos de <em>Tiempo de Dios</em>","");
  app.innerHTML=`<div class="sec"><h2>¿Ya no quieres recibir nuestros correos?</h2><p style="margin:0;color:var(--muted)">Dejarás de recibir invitaciones y newsletters. Si te registras a un evento, igual te avisaremos de ese evento.</p><div class="btns"><button class="btn" id="bajaSi">Sí, darme de baja</button></div></div>`;
  $("bajaSi").onclick=async()=>{$("bajaSi").disabled=true;const {data,error}=await sb.rpc("crm_baja",{t});
    if(error){aviso(esc(errTxt(error)),true);return}
    app.innerHTML=`<div class="done no"><h2>Listo${data&&data.nombre?", "+esc(data.nombre):""}.</h2><p>Ya no te mandaremos correos. Si cambias de opinión, regístrate a cualquier evento y marca la casilla de correos.</p></div>`}}

/* ---------- Liga personal: registrarse, confirmar o cancelar ---------- */
async function personal(t,ev,f,r){
  const {data,error}=await sb.rpc("crm_responder",{t,ev,f,r:"info"});
  if(error){aviso(esc(errTxt(error)),true);return}
  const d=data,ya=["registrado","confirmo","asistio"].includes(d.estado),pasado=d.fecha<key(new Date());
  titulo(`${esc(d.nombre?d.nombre+", ":"")}te <em>esperamos</em>`,cuandoTxt(d));
  const est={registrado:"Ya estás registrado.",confirmo:"Ya confirmaste que vienes. 🙌",cancelo:"Nos dijiste que no podrás ir.",asistio:"¡Gracias por venir!",no_asistio:"",invitado:""}[d.estado]||"";
  app.innerHTML=`<div class="sec"><h2>${esc(d.titulo)}</h2><p class="cuando" style="margin:0">${esc(cuandoTxt(d))}</p>${est?`<p style="margin:0;color:var(--muted)">${est}</p>`:""}
    ${pasado?`<p style="margin:0;color:var(--muted)">Este evento ya pasó.</p>`:`<div class="btns">${ya||r==="si"?`<button class="btn" data-r="si">Sí voy</button><button class="btn ghost" data-r="no">No podré ir</button>`:`<button class="btn" data-r="registrar">Registrarme</button>${d.estado?`<button class="btn ghost" data-r="no">No podré ir</button>`:""}`}</div>`}</div>`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{app.querySelectorAll("[data-r]").forEach(x=>x.disabled=true);
    const res=await sb.rpc("crm_responder",{t,ev,f,r:b.dataset.r});
    if(res.error){aviso(esc(errTxt(res.error)),true);return}
    const no=b.dataset.r==="no";
    app.innerHTML=`<div class="done${no?" no":""}"><h2>${no?"Gracias por avisarnos.":"¡Listo! Te esperamos."}</h2><p class="cuando">${esc(d.titulo)} · ${esc(cuandoTxt(d))}</p><p>${no?"Ojalá te veamos en el siguiente. Si cambias de planes, vuelve a abrir esta liga.":"Te mandaremos un recordatorio unos días antes."}</p></div>`})}

/* ---------- Formulario abierto ---------- */
const KEY="tdd-registro";
function guardado(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
async function formulario(){
  const {data,error}=await sb.rpc("registro_eventos");
  if(error){aviso("No pudimos cargar los eventos. Intenta de nuevo en un momento.",true);return}
  const hoy=key(new Date()),hasta=key(addDays(new Date(),75));
  let evs=data||[];
  if(RUTA==="cenaculo"||RUTA==="cenaculos")evs=evs.filter(e=>e.tipo==="cenaculo");else if(RUTA)evs=evs.filter(e=>e.id===RUTA);
  const ops=evs.flatMap(e=>A.ocurrencias(e,hoy,hasta).map(o=>({ev:e,fecha:o.ini}))).filter(o=>o.fecha>=hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.ev.hora||"").localeCompare(b.ev.hora||"")).slice(0,8);
  if(!ops.length){titulo("Regístrate a un <em>evento</em>","");aviso("Por ahora no hay eventos con registro abierto. Vuelve pronto.");return}
  const qe=Q.get("e"),qf=Q.get("f");let sel=ops.find(o=>o.ev.id===qe&&o.fecha===qf)||ops.find(o=>o.ev.id===qe)||ops[0];
  const soloCen=ops.every(o=>o.ev.tipo==="cenaculo");
  titulo(soloCen?"Regístrate al <em>cenáculo</em>":"Regístrate a un <em>evento</em>","Aparta tu lugar en un minuto. Te mandaremos un recordatorio unos días antes.");
  const g=guardado();
  app.innerHTML=`<section class="sec"><h2>¿A cuál vienes?</h2><div class="ops" id="ops">${ops.map((o,i)=>`<button type="button" class="op" data-i="${i}" aria-pressed="${o===sel}"><b>${esc(o.ev.titulo)}</b><span>${esc(larga(o.fecha))}${o.ev.hora?" · "+esc(hora12(o.ev.hora)):""}</span>${o.ev.lugar?`<span>${esc(o.ev.lugar)}</span>`:""}</button>`).join("")}</div></section>
  <form class="sec" id="f" autocomplete="on" novalidate><h2>Tus datos</h2>
    ${g?`<p style="margin:0;color:var(--muted)" id="yaw">Usamos los datos que pusiste la vez pasada. <button type="button" class="link" id="noyo">No soy ${esc((g.nombre||"").split(" ")[0])}</button></p>`:""}
    <div class="fields">
      <div class="f full"><label for="nombre">Nombre completo</label><input class="in" id="nombre" name="name" autocomplete="name" maxlength="120" required value="${esc(g&&g.nombre||"")}"></div>
      <div class="f"><label for="tel">Teléfono (WhatsApp)</label><input class="in" id="tel" name="tel" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required placeholder="10 dígitos" value="${esc(g&&g.tel||"")}"></div>
      <div class="f"><label for="correo">Correo</label><input class="in" id="correo" name="email" type="email" autocomplete="email" maxlength="160" required value="${esc(g&&g.correo||"")}"></div>
      <div class="f"><label for="nac">Fecha de nacimiento</label><input class="in" id="nac" type="date" autocomplete="bday" required max="${hoy}" value="${esc(g&&g.nac||"")}"><small>Para felicitarte en tu cumpleaños 🎂</small></div>
      <div class="trampa" aria-hidden="true"><label for="web">No llenes este campo</label><input id="web" tabindex="-1" autocomplete="off"></div>
    </div>
    <label class="chk"><input type="checkbox" id="acepta" checked> Quiero recibir por correo invitaciones y noticias de Tiempo de Dios. Puedo darme de baja cuando quiera.</label>
    <p id="msg" class="notice err" hidden></p>
    <button class="btn" type="submit" id="enviar">Registrarme</button>
    <p style="margin:0;font-size:13px;color:var(--muted)">Usamos tus datos solo para los eventos y la comunidad de Tiempo de Dios. No los compartimos con nadie.</p>
  </form>`;
  $("ops").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;sel=ops[+b.dataset.i];$("ops").querySelectorAll(".op").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  if($("noyo"))$("noyo").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}["nombre","tel","correo","nac"].forEach(i=>$(i).value="");$("yaw").remove();$("nombre").focus()};
  $("f").onsubmit=async e=>{e.preventDefault();const m=$("msg");m.hidden=true;
    if($("web").value)return;  // bot
    const nombre=$("nombre").value.trim(),tel=$("tel").value.trim(),correo=$("correo").value.trim(),nac=$("nac").value;
    const falta=nombre.length<2?"Escribe tu nombre.":tel.replace(/\D/g,"").length<10?"Escribe tu teléfono a 10 dígitos.":!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)?"Revisa tu correo.":!nac?"Escribe tu fecha de nacimiento.":"";
    if(falta){m.textContent=falta;m.hidden=false;return}
    $("enviar").disabled=true;$("enviar").textContent="Registrando…";
    const {data:r,error}=await sb.rpc("registro_evento",{ev:sel.ev.id,f:sel.fecha,nombre,telefono:tel,correo,nacimiento:nac,acepta:$("acepta").checked});
    if(error){m.textContent=errTxt(error);m.hidden=false;$("enviar").disabled=false;$("enviar").textContent="Registrarme";return}
    try{localStorage.setItem(KEY,JSON.stringify({nombre,tel,correo,nac}))}catch(e){}
    titulo(`¡Nos vemos, <em>${esc(nombre.split(" ")[0])}</em>!`,"");
    app.innerHTML=`<div class="done"><h2>Ya estás registrado.</h2><p class="cuando">${esc(sel.ev.titulo)} · ${esc(larga(sel.fecha))}${sel.ev.hora?" · "+esc(hora12(sel.ev.hora)):""}${sel.ev.lugar?" · "+esc(sel.ev.lugar):""}</p><p>Dos días antes te escribiremos por WhatsApp para confirmar. Si al final no puedes, contéstanos ahí.</p></div>`;
    window.scrollTo(0,0)}}

(async()=>{
  if(!sb){aviso("El registro todavía no está configurado.",true);return}
  const t=Q.get("t"),b=Q.get("baja"),e=Q.get("e"),f=Q.get("f");
  try{
    if(b&&UUID.test(b))await baja(b);
    else if(t&&UUID.test(t)&&e&&/^\d{4}-\d{2}-\d{2}$/.test(f||""))await personal(t,e,f,Q.get("r"));
    else await formulario();
  }catch(err){console.error(err);aviso("Algo falló. Recarga la página.",true)}
})();
</script>
</body>
</html>
